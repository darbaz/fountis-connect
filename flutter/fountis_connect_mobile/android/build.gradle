group = "org.fountis.connect.flutter"
version = "1.0.0"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The app provides the Android and Kotlin Gradle plugins.
apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// In this repository the Kotlin SDK is next to this package. In the pub package, flutter/scripts/vendor-native.sh
// copies it to android/connect-sdk.
def inRepo = file("../../../android/connect/src/main").exists()
def sdkMain = inRepo ? file("../../../android/connect/src/main") : file("connect-sdk/main")

android {
    // Same namespace as the SDK, so its R class (notification icon, styles) resolves unchanged.
    namespace = "org.fountis.connect"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += new File(sdkMain, "kotlin")
            res.srcDirs += new File(sdkMain, "res")
            assets.srcDirs += new File(sdkMain, "assets")
        }
    }

    defaultConfig {
        minSdk = 23
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.work:work-runtime-ktx:2.10.0")
    implementation("androidx.webkit:webkit:1.12.1")
    implementation("androidx.lifecycle:lifecycle-process:2.8.7")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
}
