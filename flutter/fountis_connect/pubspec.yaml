name: fountis_connect
description: FOUNTIS Connect for Flutter. Offers your users short research studies, shown full screen by the native SDKs, or by the Web SDK on the web.
version: 1.1.0
homepage: https://github.com/darbaz/fountis-connect
repository: https://github.com/darbaz/fountis-connect/tree/main/flutter/fountis_connect
issue_tracker: https://github.com/darbaz/fountis-connect/issues
topics:
  - survey
  - research
  - sdk

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: fountis_connect_mobile
      ios:
        default_package: fountis_connect_mobile
      web:
        default_package: fountis_connect_web

dependencies:
  flutter:
    sdk: flutter
  fountis_connect_platform_interface: ^1.1.0
  fountis_connect_mobile: ^1.1.0
  fountis_connect_web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
