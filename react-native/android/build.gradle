plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.fountis'
version = '1.1.0'

// In this repository the Kotlin SDK is next to this package. In the npm package, scripts/vendor-native.sh
// copies it to android/connect-sdk (run automatically on `npm pack`).
def inRepo = file('../../android/connect/src/main').exists()
def sdkMain = inRepo ? file('../../android/connect/src/main') : file('connect-sdk/main')

android {
  // Same namespace as the SDK, so its R class (notification icon, styles) resolves unchanged.
  namespace 'org.fountis.connect'
  defaultConfig {
    versionCode 1
    versionName '1.1.0'
  }
  sourceSets {
    main {
      java.srcDirs += new File(sdkMain, 'kotlin')
      res.srcDirs += new File(sdkMain, 'res')
      assets.srcDirs += new File(sdkMain, 'assets')
    }
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.work:work-runtime-ktx:2.10.0'
  implementation 'androidx.webkit:webkit:1.12.1'
  implementation 'androidx.lifecycle:lifecycle-process:2.8.7'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
  implementation 'com.google.android.play:integrity:1.6.0'
}
